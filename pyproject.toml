[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsmodel"
version = "0.1.0"
description = "Machine-learning statistical downscaling (k-NN, random forest, ridge regression, MLP) of climate-model output to weather stations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Santiago Duarte"}]
keywords = ["downscaling", "climate", "precipitation", "machine learning", "hydroinformatics"]
dependencies = [
    "numpy",
    "pandas>=2.2",
    "scipy",          # classic NetCDF files
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]
netcdf = ["netCDF4"]  # optional: NetCDF4/HDF5 files; classic NetCDF works with scipy alone
notebook = ["jupyter", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:sklearn", "ignore::sklearn.exceptions.ConvergenceWarning"]
